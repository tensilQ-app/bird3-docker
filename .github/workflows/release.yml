name: Release BIRD 3
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable upstream version (blank = latest)'
        required: false
        type: string
      rebuild:
        description: 'Rebuild and republish existing version (refresh dependencies)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: bird3-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download official stable release
        id: source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py --version "$REQUESTED_VERSION" --output "$GITHUB_OUTPUT"
      - name: Decide whether to publish
        id: decision
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bird3
          VERSION: ${{ steps.source.outputs.version }}
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          set -euo pipefail
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" != "true" ] && docker manifest inspect "${IMAGE,,}:$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.decision.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.decision.outputs.publish == 'true'
      - name: Build and runtime-test each architecture
        if: steps.decision.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "BIRD_VERSION=$VERSION" --build-arg "BIRD_SHA256=$SHA256" \
              -t "bird3-test:$arch" .
            bash scripts/test-image.sh "bird3-test:$arch" "linux/$arch" "$VERSION"
          done
      - name: Login to GHCR
        if: steps.decision.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-architecture image
        if: steps.decision.outputs.publish == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.decision.outputs.image }}
          VERSION: ${{ steps.source.outputs.version }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "BIRD_VERSION=$VERSION" --build-arg "BIRD_SHA256=$SHA256" \
            --provenance=true --sbom=true --push \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$minor" -t "$IMAGE:3" -t "$IMAGE:latest" .
          docker buildx imagetools inspect "$IMAGE:$VERSION"
