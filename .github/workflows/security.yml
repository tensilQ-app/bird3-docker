name: Scan published image
on:
  schedule:
    - cron: '53 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - scripts/rebuild-state.py
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: bird3-published-security
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the current public release index for both scans
        id: resolve
        run: python3 scripts/rebuild-state.py resolve --output "$GITHUB_OUTPUT"
  scan:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Pull the published architecture anonymously
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: docker pull --platform "linux/$ARCH" "$IMAGE"
      - name: Scan with a fresh Trivy vulnerability database
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" \
            aquasec/trivy:0.76.1 image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format json --output /work/trivy.json "$IMAGE"
      - name: Preserve the scan report even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-trivy-${{ matrix.arch }}
          path: trivy.json
          retention-days: 7
