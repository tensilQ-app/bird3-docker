name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile scripts/check-release.py
      - name: Shell syntax
        run: bash -n scripts/test-image.sh
      - name: Download official release
        id: source
        run: python3 scripts/check-release.py --output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and test both platforms
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "BIRD_VERSION=$VERSION" --build-arg "BIRD_SHA256=$SHA256" \
              -t "bird3-ci:$arch" .
            bash scripts/test-image.sh "bird3-ci:$arch" "linux/$arch" "$VERSION"
          done
